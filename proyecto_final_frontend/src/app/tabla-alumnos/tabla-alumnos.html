<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="with: 100%">
  <!-- columna id_alumno-->
  <ng-container matColumnDef="id_alumno">
    <th mat-header-cell *matHeaderCellDef>Id Alumno</th>
    <td mat-cell *matCellDef="let alum">
      <strong>{{ alum.id_alumno }}</strong>
    </td>
  </ng-container>

  <!-- columna nombre_completo -->
  <ng-container matColumnDef="nombre_completo">
    <th mat-header-cell *matHeaderCellDef>Nombres y Apellidos</th>
    <td mat-cell *matCellDef="let alum">{{ alum.nombre_completo }}</td>
  </ng-container>

  <!-- columna facultad -->
  <ng-container matColumnDef="facultad">
    <th mat-header-cell *matHeaderCellDef>Facultad</th>
    <td mat-cell *matCellDef="let alum">
      <mat-chip>{{ alum.facultad }}</mat-chip>
    </td>
  </ng-container>

  <!-- columna carrera -->
  <ng-cantainer matColumnDef="carrera">
    <th mat-header-cell *matHeaderCellDef>Carrera</th>
    <td mat-cell *matCellDef="let alum">{{ alum.carrera }}</td>
  </ng-cantainer>

  <!-- columna semestre -->
  <ng-container matColumnDef="semestre">
    <th mat-header-cell *matHeaderCellDef>Semestre</th>
    <td mat-cell *matCellDef="let alum">
      <strong>{{ alum.semestre }}</strong>
    </td>
  </ng-container>

  <!-- Columna promedio ponderado-->
  <ng-container matColumnDef="promedio_ponderado">
    <th mat-header-cell *matHeaderCellDef>Promedio Ponderado</th>
    <td
      mat-cell
      *matCellDef="let alum"
      [style.color]="alum.promedio_ponderado < 10.5 ? 'red' : 'green'"
    >
      <strong>{{ alum.promedio_ponderado }}</strong>
    </td>
  </ng-container>

  <!-- Columna acciones  -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let alum">
      <button
        mat-raised-button
        color="primary"
        [routerLink]="['/detalle-alumno', alum.id_alumno]"
        [state]="{ alumno: alum }"
      >
        Ver Detalles
      </button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
