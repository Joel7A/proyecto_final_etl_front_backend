<div style="padding: 30px; max-width: 900px; margin: 0 auto">
  <mat-card-header>
    <mat-card-title>Sistema de Gestión Alumnos</mat-card-title>
    <mat-card-subtitle>: Seleccione una opción para comenzar.</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field apperance="outline" style="width: 100%">
      <mat-label>Buscar alumnos por facultad</mat-label>
      <!------------------------------------------------------------------------------------------------------------------------------------------->
      <mat-select (selectionChange)="filtrarPorFacultad($event.value)">
        <mat-option value="Todos">Todos</mat-option>
        <mat-option value="Administración">Administración</mat-option>
        <mat-option value="Derecho">Derecho</mat-option>
        <mat-option value="Ingeniería De Producción Y Servicios"
          >Ingeniería De Producción Y Servicios</mat-option
        >
        <mat-option value="Ingeniería De Sistemas">Ingeniería De Sistemas</mat-option>
        <mat-option value="Medicina">Medicina</mat-option>
      </mat-select>
    </mat-form-field>
    <app-tabla-alumnos [lista]="alumnosEnPantalla"></app-tabla-alumnos>
  </mat-card-content>
</div>
